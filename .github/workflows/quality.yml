name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sw_m7_replenishment_test
          POSTGRES_USER: sw_m7_replenishment_test
          POSTGRES_PASSWORD: test-only
        ports:
          - 127.0.0.1:18547:5432
        options: >-
          --health-cmd "pg_isready -U sw_m7_replenishment_test -d sw_m7_replenishment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://sw_m7_replenishment_test:test-only@127.0.0.1:18547/sw_m7_replenishment_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://sw_m7_replenishment_test:test-only@127.0.0.1:18547/sw_m7_replenishment_migration_test
      DATABASE_URL: postgresql+psycopg://sw_m7_replenishment_test:test-only@127.0.0.1:18547/sw_m7_replenishment_test
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev,forecasting,anomalies,gis]"
      - name: Ruff
        run: python -m ruff check app tests alembic
      - name: Guarded migration and backend tests
        run: python -m tests.run_quality_ci backend

  windows-guards:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install backend dependencies
        run: python -m pip install -e ".[dev,forecasting,anomalies]"
      - name: Verify exact Windows-only guard tests
        run: python -m tests.run_quality_ci windows

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run test:all
      - run: npm run typecheck
      - run: npm run build

  e2e:
    needs: [backend, windows-guards, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      QUALITY_CI_PROFILE: synthetic-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install pinned backend dependencies
        run: python -m pip install -e ".[dev,forecasting,anomalies]"
      - name: Install frontend and Chromium
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Guarded synthetic browser matrix
        run: python -m tests.run_quality_ci e2e
