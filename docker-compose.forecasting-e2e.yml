name: sw-m6-forecast-e2e
services:
  db:
    image: postgres:16-alpine
    labels: { task: demand-forecasting, role: isolated-e2e }
    environment:
      POSTGRES_DB: ${M6_DB_NAME:?required}
      POSTGRES_USER: ${M6_DB_USER:?required}
      POSTGRES_PASSWORD: ${M6_DB_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build:
      context: ${M6_BACKEND_BUILD_CONTEXT:?required}
    labels: { task: demand-forecasting, role: isolated-e2e }
    environment:
      DATABASE_URL: ${M6_DATABASE_URL:?required}
    command: [alembic, upgrade, head]
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
    restart: 'no'
  bootstrap:
    build:
      context: ${M6_BACKEND_BUILD_CONTEXT:?required}
    labels: { task: demand-forecasting, role: isolated-e2e }
    environment:
      DATABASE_URL: ${M6_DATABASE_URL:?required}
      SEED_ADMIN_EMAIL: ${M6_ADMIN_EMAIL:?required}
      SEED_ADMIN_PASSWORD: ${M6_ADMIN_PASSWORD:?required}
      SEED_WAREHOUSE_EMAIL: ${M6_WAREHOUSE_EMAIL:?required}
      SEED_WAREHOUSE_PASSWORD: ${M6_WAREHOUSE_PASSWORD:?required}
      SEED_CLIENT_EMAIL: ${M6_CLIENT_EMAIL:?required}
      SEED_CLIENT_PASSWORD: ${M6_CLIENT_PASSWORD:?required}
    command: [python, -m, app.seed]
    networks: [internal]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: 'no'
  api:
    build:
      context: ${M6_BACKEND_BUILD_CONTEXT:?required}
    labels: { task: demand-forecasting, role: isolated-e2e }
    environment:
      APP_ENV: integration
      DATABASE_URL: ${M6_DATABASE_URL:?required}
      JWT_SECRET_KEY: ${M6_JWT_SECRET:?required}
      FORECAST_CATALOG_ROOT: /forecast-catalog
      FORECAST_ALLOW_FIXTURE: 'true'
    volumes:
      - type: bind
        source: ${M6_FORECAST_CATALOG:?required}
        target: /forecast-catalog
        read_only: true
    networks: [internal]
    depends_on:
      bootstrap: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2).read()"]
      interval: 5s
      timeout: 4s
      retries: 20
  web:
    build:
      context: ./client
    labels: { task: demand-forecasting, role: isolated-e2e }
    networks: [internal]
    depends_on:
      api: { condition: service_healthy }
    ports:
      - '127.0.0.1:58081:8080'
volumes:
  database:
    labels: { task: demand-forecasting, role: isolated-e2e }
networks:
  internal:
    labels: { task: demand-forecasting, role: isolated-e2e }
