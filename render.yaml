services:
  - type: web
    name: smart-warehouse-demo-api
    runtime: docker
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    dockerCommand: python /app/render-start.py
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: INSTALL_ANOMALY_DEPENDENCIES
        value: "1"
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: smart-warehouse-demo-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: GIS_CATALOG_ROOT
        value: /tmp/smart-warehouse-gis
      - key: GIS_SNAPSHOT_ID
        sync: false
      - key: GIS_RELEASE_ASSET_BASE
        sync: false
      - key: RENDER_DEMO_BUNDLE_URL
        value: https://github.com/tonazario08/smart-warehouse/releases/download/render-integrated-fixture-20261118/smart-warehouse-synthetic-render-integrated.zip
      - key: RENDER_DEMO_BUNDLE_SHA256
        value: "042c35b792209a06c48575878d40c935609b028af0b63f9d8447d628ac7458d4"
      - key: ASSISTANT_ENABLED
        value: "true"
      - key: ASSISTANT_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: ASSISTANT_MODEL
        value: qwen/qwen3.8-27b
      - key: ASSISTANT_SEARCH_LIMIT
        value: "2"
      - key: ASSISTANT_API_KEY
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_WAREHOUSE_EMAIL
        sync: false
      - key: SEED_WAREHOUSE_PASSWORD
        sync: false
      - key: SEED_CLIENT_EMAIL
        sync: false
      - key: SEED_CLIENT_PASSWORD
        sync: false

  - type: web
    name: smart-warehouse-demo
    runtime: static
    rootDir: client
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22.20.0"
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: smart-warehouse-demo-db
    databaseName: smart_warehouse_render_demo
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    ipAllowList: []
