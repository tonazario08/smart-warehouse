services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_warehouse
      POSTGRES_USER: smart_warehouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_warehouse -d smart_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./client
    depends_on:
      - api
    ports:
      - "5173:5173"

volumes:
  postgres_data:
