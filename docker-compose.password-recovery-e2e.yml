# Apply only with docker-compose.yml and docker-compose.e2e.yml under an isolated project name.
services:
  api:
    environment:
      APP_ENV: integration
      PASSWORD_RECOVERY_ENABLED: "true"
      PASSWORD_RECOVERY_ORIGIN: http://127.0.0.1:${E2E_WEB_PORT:-58081}
      PASSWORD_RECOVERY_FROM_EMAIL: no-reply@example.com
      RESEND_API_KEY: test-only-no-transport
      CORS_ORIGINS: '["http://127.0.0.1:${E2E_WEB_PORT:-58081}"]'
    volumes:
      - ./tests/password_recovery_e2e_app.py:/app/password_recovery_e2e_app.py:ro
    command: ["uvicorn", "password_recovery_e2e_app:app", "--host", "0.0.0.0", "--port", "8000"]

  web:
    ports: !override
      - "127.0.0.1:${E2E_WEB_PORT:-58081}:8080"
